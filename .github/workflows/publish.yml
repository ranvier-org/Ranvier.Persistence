name: Publish NuGet

on:
  workflow_run:
    workflows: [CI]
    branches: [main, master]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_commit.message, 'chore: release ')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: bin
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Authenticate to NuGet with trusted publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'shayan.habibi' }}
      - name: Publish packages validated by CI
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'bin/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
